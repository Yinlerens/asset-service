apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-service
  namespace: asset-service
  labels:
    app.kubernetes.io/name: asset-service
    app.kubernetes.io/part-of: asset-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-service
        app.kubernetes.io/part-of: asset-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: asset-service
          image: ghcr.io/yinlerens/asset-service@sha256:1aeabb641100827284f4368e49bb41947ef90d4eb67818f51212c75219ecb4b5
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: MAX_LEDGER_LIMIT
              value: "100"
            - name: OTEL_SERVICE_NAME
              value: asset-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=test,k8s.cluster.name=wuwa
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asset-service-secrets
                  key: database-url
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: asset-service-secrets
                  key: internal-token
          startupProbe:
            httpGet:
              port: http
              path: /health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              port: http
              path: /ready
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              port: http
              path: /health
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
