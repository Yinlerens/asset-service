apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-service
  namespace: asset-service
  labels:
    app.kubernetes.io/name: asset-service
    app.kubernetes.io/part-of: asset-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-service
        app.kubernetes.io/part-of: asset-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: asset-service
          image: ghcr.io/yinlerens/asset-service@sha256:703125e123c5d167a04ec15903bea91653585cc7510f1a0778b5b748facc185a
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: MAX_LEDGER_LIMIT
              value: "100"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asset-service-secrets
                  key: database-url
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: asset-service-secrets
                  key: internal-token
          startupProbe:
            httpGet:
              port: http
              path: /health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              port: http
              path: /ready
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              port: http
              path: /health
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
