services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asset
      POSTGRES_PASSWORD: asset
      POSTGRES_DB: asset
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - asset_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset -d asset"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - postgres://asset:asset@db:5432/asset?sslmode=disable
      - up

  asset-service:
    build:
      context: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://asset:asset@db:5432/asset?sslmode=disable
      INTERNAL_TOKEN: local-dev-token
      MAX_LEDGER_LIMIT: "100"
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  asset_pgdata:
